name: Importar RSS periodicamente

on:
  push:
    paths:
      - ".github/workflows/rss-import.yml"
  schedule:
    - cron: "7/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: importar-rss
  cancel-in-progress: false

jobs:
  import-rss:
    name: Importar notícias RSS
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Chamar backend
        env:
          BACKEND_URL: ${{ secrets.COMUNIDADE_ROCK_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.COMUNIDADE_ROCK_CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure os secrets COMUNIDADE_ROCK_BACKEND_URL e COMUNIDADE_ROCK_CRON_SECRET."
            exit 1
          fi

          response_file=$(mktemp)
          set +e
          status=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 75 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 240 \
            --retry-all-errors \
            -o "$response_file" \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BACKEND_URL/api/cron/rss")
          curl_exit=$?
          set -e

          cat "$response_file"
          rm -f "$response_file"

          if [ "$curl_exit" -ne 0 ]; then
            echo "Falha de comunicação com o backend após novas tentativas (curl exit $curl_exit)."
            exit "$curl_exit"
          fi

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Backend retornou HTTP $status mesmo após novas tentativas."
            exit 1
          fi
